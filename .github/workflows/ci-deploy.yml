name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test and build deployment bundle
        run: npm run validate

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: sync-ignore-production
      cancel-in-progress: false
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Deploy exact commit to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke-test production UI and API
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          site_url="${SITE_URL%/}"
          home_body="$(mktemp)"
          api_body="$(mktemp)"
          api_headers="$(mktemp)"

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "$site_url/" --output "$home_body"
          grep --fixed-strings --quiet "Sync what matters." "$home_body"

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --dump-header "$api_headers" \
            "$site_url/api?patterns=windows" --output "$api_body"
          grep --ignore-case --extended-regexp --quiet \
            '^content-type: text/plain; charset=utf-8' "$api_headers"
          grep --fixed-strings --quiet '//---Windows-Specific---//' "$api_body"
          grep --fixed-strings --quiet '(?d)Thumbs.db' "$api_body"

