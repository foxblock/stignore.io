name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test and build deployment bundle
        run: npm run validate

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: stignore-production
      cancel-in-progress: false
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Deploy exact commit to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke-test production UI and API
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          : "${SITE_URL:?SITE_URL secret is not configured for production}"
          site_url="${SITE_URL%/}"
          home_body="$(mktemp)"
          list_body="$(mktemp)"
          api_body="$(mktemp)"
          api_headers="$(mktemp)"
          trap 'rm -f "$home_body" "$list_body" "$api_body" "$api_headers"' EXIT

          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "$site_url/" --output "$home_body"
          grep --fixed-strings --quiet \
            'Build your <code>.stignore</code>' "$home_body" || {
              echo "::error::Production UI is missing expected page heading"
              exit 1
            }

          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "$site_url/api/list" --output "$list_body"
          block_id="$(tr -d '\r\n' < "$list_body" | cut -d, -f1)"
          if [[ ! "$block_id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Production block list returned no valid block ID"
            exit 1
          fi

          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --dump-header "$api_headers" \
            "$site_url/api?patterns=$block_id" --output "$api_body"
          grep --ignore-case --extended-regexp --quiet \
            '^content-type: text/plain; charset=utf-8' "$api_headers" || {
              echo "::error::Production API returned unexpected content type"
              exit 1
            }
          generated_header="$(head -n 1 "$api_body" | tr -d '\r')"
          if [[ "$generated_header" != "// generated by: "*"/api?patterns=$block_id" ]]; then
            echo "::error::Production API response has invalid generated-source header"
            exit 1
          fi
          if ! tail -n +3 "$api_body" | grep --extended-regexp --quiet '[^[:space:]]'; then
            echo "::error::Production API response contains no generated block content"
            exit 1
          fi
